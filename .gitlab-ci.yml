stages:
  - build
  - test

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

# ── Backend ───────────────────────────────────────────────────────────────────

backend:build:
  stage: build
  image: maven:3.9-eclipse-temurin-21
  script:
    - cd backend
    - mvn package -DskipTests -q
  artifacts:
    paths:
      - backend/target/*.jar
    expire_in: 1 hour
  cache:
    key: maven-$CI_COMMIT_REF_SLUG
    paths:
      - .m2/repository

backend:test:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  script:
    - cd backend
    - mvn test -q
  cache:
    key: maven-$CI_COMMIT_REF_SLUG
    paths:
      - .m2/repository
  artifacts:
    when: always
    reports:
      junit: backend/target/surefire-reports/TEST-*.xml

# ── Frontend ──────────────────────────────────────────────────────────────────

frontend:build:
  stage: build
  image: node:24-alpine
  script:
    - cd frontend
    - npm ci --quiet
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 hour
  cache:
    key: npm-$CI_COMMIT_REF_SLUG
    paths:
      - frontend/node_modules/
