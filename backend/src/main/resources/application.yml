spring:
  application:
    name: riskboard-backend
  profiles:
    default: dev          # profil dev activé automatiquement en local
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: riskboard-backend
      environment: ${SPRING_PROFILES_ACTIVE:dev}

logging:
  level:
    com.riskboard: INFO
    org.springframework.web: WARN
