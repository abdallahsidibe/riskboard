name: Deploy

# Triggered by build.yml after a successful image push, or manually.
#
# GitHub Environments used:
#   integration  → auto deploy, no approval
#   production   → requires manual approval (Release Manager)
#
# Each environment must define:
#   vars.VPS_HOST
#   vars.VPS_USER
#   vars.DEPLOY_PATH          (/opt/riskboard/int or /opt/riskboard/prod)
#   vars.COMPOSE_PROJECT_NAME (riskboard-int or riskboard-prod)
#   secrets.SSH_PRIVATE_KEY
#   secrets.DB_USERNAME
#   secrets.DB_PASSWORD

on:
  workflow_call:
    inputs:
      image_tag:
        description: Short Git SHA of the image to deploy
        required: true
        type: string
      target:
        description: Target environment (int-only, or int-then-prod)
        required: false
        type: string
        default: int-then-prod
  workflow_dispatch:
    inputs:
      image_tag:
        description: Short Git SHA to deploy — laisser vide pour utiliser le dernier commit de la branche
        required: false
        type: string
      target:
        description: Target environment
        required: true
        type: choice
        options:
          - int-only
          - prod-only
          - int-then-prod
        default: int-only

jobs:
  # ── Resolve image tag ────────────────────────────────────────────────────────
  resolve-tag:
    name: Resolve image tag
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Compute tag
        id: tag
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            echo "value=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify image exists on GHCR
        run: |
          TAG="${{ steps.tag.outputs.value }}"
          echo "Checking ghcr.io/${{ github.repository_owner }}/riskboard-backend:$TAG"
          docker manifest inspect ghcr.io/${{ github.repository_owner }}/riskboard-backend:$TAG > /dev/null \
            || { echo "ERROR: Image tag '$TAG' not found on GHCR. Run build.yml first."; exit 1; }

  # ── INT ─────────────────────────────────────────────────────────────────────
  deploy-int:
    name: Deploy ${{ needs.resolve-tag.outputs.image_tag }} → INT
    runs-on: ubuntu-latest
    needs: resolve-tag
    environment: integration
    if: inputs.target == 'int-only' || inputs.target == 'int-then-prod'

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Sync compose file → INT
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: docker-compose.prod.yml
          target: ${{ vars.DEPLOY_PATH }}
          strip_components: 0
          overwrite: true

      - name: Rename compose file on VPS
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: mv ${{ vars.DEPLOY_PATH }}/docker-compose.prod.yml ${{ vars.DEPLOY_PATH }}/compose.yml

      - name: Deploy INT via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ${{ vars.DEPLOY_PATH }}

            # Save current tag for rollback
            [ -f .current_tag ] && cp .current_tag .previous_tag
            echo "${{ needs.resolve-tag.outputs.image_tag }}" > .current_tag

            # Inject GitHub Environment variable into .env
            sed -i '/^CORS_ALLOWED_ORIGINS=/d' .env
            echo "CORS_ALLOWED_ORIGINS=${{ vars.CORS_ALLOWED_ORIGINS }}" >> .env

            # Ensure postgres is running (idempotent — no-op if already healthy)
            docker compose \
              -p ${{ vars.COMPOSE_PROJECT_NAME }} \
              --env-file .env \
              -f compose.yml \
              up -d postgres

            # Pull and deploy with project isolation
            IMAGE_TAG=${{ needs.resolve-tag.outputs.image_tag }} \
            docker compose \
              -p ${{ vars.COMPOSE_PROJECT_NAME }} \
              --env-file .env \
              -f compose.yml \
              pull backend frontend

            IMAGE_TAG=${{ needs.resolve-tag.outputs.image_tag }} \
            docker compose \
              -p ${{ vars.COMPOSE_PROJECT_NAME }} \
              --env-file .env \
              -f compose.yml \
              up -d --no-deps backend frontend

            docker image prune -f
            echo "INT deployed: ${{ needs.resolve-tag.outputs.image_tag }} — $(date)"

      - name: Health check INT
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            for i in $(seq 1 24); do
              status=$(curl -sf http://localhost:${{ vars.BACKEND_PORT }}/actuator/health \
                | grep -o '"status":"UP"' || true)
              if [ "$status" = '"status":"UP"' ]; then
                echo "INT backend UP"
                exit 0
              fi
              echo "Attempt $i/24 — waiting 10s..."
              sleep 10
            done
            echo "INT health check FAILED"
            exit 1

      - name: Rollback INT on failure
        if: failure()
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ${{ vars.DEPLOY_PATH }}
            [ -f .previous_tag ] || { echo "No previous tag, cannot rollback"; exit 1; }
            PREV=$(cat .previous_tag)
            echo "Rolling back INT to $PREV..."
            IMAGE_TAG=$PREV docker compose \
              -p ${{ vars.COMPOSE_PROJECT_NAME }} \
              --env-file .env \
              -f compose.yml \
              up -d --no-deps backend frontend

  # ── PROD ────────────────────────────────────────────────────────────────────
  deploy-prod:
    name: Deploy ${{ needs.resolve-tag.outputs.image_tag }} → PROD
    runs-on: ubuntu-latest
    needs: [resolve-tag, deploy-int]
    if: always() && (inputs.target == 'prod-only' || inputs.target == 'int-then-prod') && (needs.deploy-int.result == 'success' || needs.deploy-int.result == 'skipped')
    environment: production      # ← requires manual approval from Release Manager

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Sync compose file → PROD
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: docker-compose.prod.yml
          target: ${{ vars.DEPLOY_PATH }}
          strip_components: 0
          overwrite: true

      - name: Rename compose file on VPS
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: mv ${{ vars.DEPLOY_PATH }}/docker-compose.prod.yml ${{ vars.DEPLOY_PATH }}/compose.yml

      - name: Deploy PROD via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ${{ vars.DEPLOY_PATH }}

            [ -f .current_tag ] && cp .current_tag .previous_tag
            echo "${{ needs.resolve-tag.outputs.image_tag }}" > .current_tag

            # Inject GitHub Environment variable into .env
            sed -i '/^CORS_ALLOWED_ORIGINS=/d' .env
            echo "CORS_ALLOWED_ORIGINS=${{ vars.CORS_ALLOWED_ORIGINS }}" >> .env

            # Ensure postgres is running (idempotent — no-op if already healthy)
            docker compose \
              -p ${{ vars.COMPOSE_PROJECT_NAME }} \
              --env-file .env \
              -f compose.yml \
              up -d postgres

            IMAGE_TAG=${{ needs.resolve-tag.outputs.image_tag }} \
            docker compose \
              -p ${{ vars.COMPOSE_PROJECT_NAME }} \
              --env-file .env \
              -f compose.yml \
              pull backend frontend

            IMAGE_TAG=${{ needs.resolve-tag.outputs.image_tag }} \
            docker compose \
              -p ${{ vars.COMPOSE_PROJECT_NAME }} \
              --env-file .env \
              -f compose.yml \
              up -d --no-deps backend frontend

            docker image prune -f
            echo "PROD deployed: ${{ needs.resolve-tag.outputs.image_tag }} — $(date)"

      - name: Health check PROD
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            for i in $(seq 1 24); do
              status=$(curl -sf http://localhost:${{ vars.BACKEND_PORT }}/actuator/health \
                | grep -o '"status":"UP"' || true)
              if [ "$status" = '"status":"UP"' ]; then
                echo "PROD backend UP"
                exit 0
              fi
              echo "Attempt $i/24 — waiting 10s..."
              sleep 10
            done
            echo "PROD health check FAILED"
            exit 1

      - name: Rollback PROD on failure
        if: failure()
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ${{ vars.DEPLOY_PATH }}
            [ -f .previous_tag ] || { echo "No previous tag, cannot rollback"; exit 1; }
            PREV=$(cat .previous_tag)
            echo "Rolling back PROD to $PREV..."
            IMAGE_TAG=$PREV docker compose \
              -p ${{ vars.COMPOSE_PROJECT_NAME }} \
              --env-file .env \
              -f compose.yml \
              up -d --no-deps backend frontend
