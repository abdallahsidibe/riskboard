name: CI

on:
  pull_request:
    branches: [main, develop, release/**]
  push:
    branches: [develop]

jobs:
  # ── Backend ─────────────────────────────────────────────────────────────────
  backend:
    name: Backend — compile & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile
        run: mvn -f backend/pom.xml compile -q

      - name: Unit tests
        run: mvn -f backend/pom.xml test -q

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Backend Tests
          path: backend/target/surefire-reports/TEST-*.xml
          reporter: java-junit

      - name: Docker build validation (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false

  # ── Frontend ─────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend — lint, test & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix frontend

      - name: Build
        run: npm run build --prefix frontend

      - name: Docker build validation (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
