name: CI

on:
  pull_request:
    branches: [main, develop, release/**]
  push:
    branches: [develop]

jobs:
  # ── Backend ─────────────────────────────────────────────────────────────────
  backend:
    name: Backend — compile & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile
        run: mvn -f backend/pom.xml compile -q

      - name: Unit tests
        run: mvn -f backend/pom.xml test -q

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v3.0.0
        with:
          name: Backend Tests
          path: backend/target/surefire-reports/TEST-*.xml
          reporter: java-junit

      - name: Docker build validation (no push)
        uses: docker/build-push-action@v7.3.0
        with:
          context: ./backend
          push: false

  # ── Observabilité ────────────────────────────────────────────────────────────
  observability:
    name: Observability — validate rules & compose
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install promtool
        run: |
          PROM_VERSION="3.4.1"
          curl -sSL "https://github.com/prometheus/prometheus/releases/download/v${PROM_VERSION}/prometheus-${PROM_VERSION}.linux-amd64.tar.gz" \
            | tar -xz --strip-components=1 -C /usr/local/bin prometheus-${PROM_VERSION}.linux-amd64/promtool

      - name: Check alert rules syntax
        run: promtool check rules observability/prometheus/rules/riskboard.rules.yml

      - name: Run alert rules unit tests
        run: promtool test rules observability/prometheus/tests/riskboard.rules.test.yml

      - name: Validate Compose syntax (prod)
        run: docker compose -f docker-compose.prod.yml config --quiet

      - name: Validate Compose syntax (observability overlay)
        run: docker compose -f docker-compose.yml -f docker-compose.observability.yml config --quiet

  # ── Frontend ─────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend — build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Node 24
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix frontend

      - name: Build
        run: npm run build --prefix frontend

      - name: Docker build validation (no push)
        uses: docker/build-push-action@v7.3.0
        with:
          context: ./frontend
          push: false
